# Prometheus scrapes the API metrics every 15 s and evaluates the alert rules
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ride-classifier-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
