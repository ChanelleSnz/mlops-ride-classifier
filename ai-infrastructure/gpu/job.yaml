# Vertex AI custom job: 1 spot T4 on n1-standard-4 (4 vCPU, 15 GB), europe-west4.
# Spot: on-demand GPU quotas of the project are 0, spot ones are not; the job may be pre-empted (then re-run it).
# Submit:  gcloud ai custom-jobs create --project=advanced-cloud-ai-i2 --region=europe-west4 \
#            --display-name=ride-classifier-cpu-vs-gpu --config=ai-infrastructure/gpu/job.yaml
workerPoolSpecs:
  - machineSpec:
      machineType: n1-standard-4
      acceleratorType: NVIDIA_TESLA_T4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: IMAGE  # replaced by the image printed by build.sh
scheduling:
  timeout: 2700s  # hard cap: 45 min
  strategy: SPOT
