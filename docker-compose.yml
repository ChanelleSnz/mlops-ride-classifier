# Local "dev" environment: MinIO (artifacts) + PostgreSQL (MLflow metadata) + MLflow + API + web app
# Start:  docker compose up -d --build
# Stop:   docker compose down        (add -v to also delete the stored data)

name: ride-classifier

services:
  minio:
    # Official minio/minio images were removed from Docker Hub in September 2026.
    # Chainguard rebuilds MinIO from source; only the :latest tag is free.
    image: cgr.dev/chainguard/minio:latest
    user: "0"  # the named volume is owned by root
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - minio-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: ride-classifier-mlflow:dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_BUCKET: mlflow
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mlflow:*"
      # Background job runner of MLflow 3 (GenAI features only, ~2 GB of RAM): not needed here
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    # All lines below have the same indentation, so YAML joins them into ONE line.
    # (Extra indentation would keep the line breaks and the shell would drop the options.)
    command:
      - sh
      - -c
      - >-
        python /app/create_bucket.py &&
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        --artifacts-destination s3://mlflow
        --serve-artifacts
        --workers 2
    ports:
      - "5001:5000"  # 5001 on the Mac: port 5000 is taken by macOS AirPlay Receiver
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ride-classifier-api:dev
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ride-classifier
      MODEL_ALIAS: champion
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
    image: ride-classifier-webapp:dev
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      API_PUBLIC_URL: http://localhost:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

  # Monitoring: Prometheus scrapes the API /metrics, Grafana shows the dashboard
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      # Local dev only: open the dashboard without login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ride-classifier.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Orchestration of the training pipeline. Optional profile (heavy, ~1.5 GB of RAM):
  #   docker compose --profile airflow up -d --build   ->  http://localhost:8080
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: ride-classifier-airflow:dev
    command: standalone
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # Local dev only: everyone is admin, no login page
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      RIDE_PROJECT_DIR: /opt/project
      RIDE_API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/project/data
      - ./feature_repo/data:/opt/project/feature_repo/data  # feature store: offline parquet, registry, online store
    ports:
      - "8080:8080"

volumes:
  minio-data:
  postgres-data:
  prometheus-data:
