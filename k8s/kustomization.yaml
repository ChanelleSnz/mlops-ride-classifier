# Production environment on the local Kubernetes cluster (Docker Desktop)
# Deploy:  kubectl apply -k k8s/
# The secret is NOT stored in git; create it once from .env:
#   kubectl create secret generic ride-classifier-secrets -n ride-classifier --from-env-file=.env
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ride-classifier
resources:
  - namespace.yaml
  - minio.yaml
  - postgres.yaml
  - mlflow.yaml
  - api.yaml
  - webapp.yaml
labels:
  - pairs: {project: ride-classifier}
# Images published on Docker Hub by the "Docker images" workflow.
# Manual deploy uses latest; the CD workflow replaces latest with the exact commit SHA.
images:
  - name: ride-classifier-api
    newName: raniamehria/ride-classifier-api
    newTag: latest
  - name: ride-classifier-webapp
    newName: raniamehria/ride-classifier-webapp
    newTag: latest
  - name: ride-classifier-mlflow
    newName: raniamehria/ride-classifier-mlflow
    newTag: latest
