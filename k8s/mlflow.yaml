# MLflow tracking server + model registry (metadata in PostgreSQL, artifacts in MinIO)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels: {app: mlflow}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      # Wait for PostgreSQL before starting MLflow (otherwise it crashes and restarts a few times)
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: mlflow
          image: ride-classifier-mlflow:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              python /app/create_bucket.py &&
              mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
              --artifacts-destination s3://mlflow
              --serve-artifacts
              --workers 2
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: ride-classifier-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ride-classifier-secrets, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: ride-classifier-secrets, key: POSTGRES_DB}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: ride-classifier-secrets, key: MINIO_ROOT_USER}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: ride-classifier-secrets, key: MINIO_ROOT_PASSWORD}}
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://minio:9000"}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - {name: MLFLOW_BUCKET, value: mlflow}
            - {name: MLFLOW_SERVER_ALLOWED_HOSTS, value: "localhost:*,127.0.0.1:*,mlflow:*,mlflow.ride-classifier:*"}
            # MLflow 3 starts a background job runner (~10 extra processes, ~2 GB) used only by
            # GenAI features (online scoring, trace archival). We do not use them: turn it off.
            - {name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION, value: "false"}
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1536Mi}  # measured: ~800 MB with 2 workers and no job runner
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: NodePort
  selector: {app: mlflow}
  ports:
    - {port: 5000, targetPort: 5000, nodePort: 30500}
