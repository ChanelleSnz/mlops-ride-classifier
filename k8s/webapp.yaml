# Streamlit web app: calls the API service inside the cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels: {app: webapp}
spec:
  replicas: 1
  selector:
    matchLabels: {app: webapp}
  template:
    metadata:
      labels: {app: webapp}
    spec:
      containers:
        - name: webapp
          image: ride-classifier-webapp  # real name and tag set in kustomization.yaml
          env:
            - {name: API_URL, value: "http://api:8000"}
            - {name: API_PUBLIC_URL, value: "http://localhost:30800"}
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  type: NodePort
  selector: {app: webapp}
  ports:
    - {port: 8501, targetPort: 8501, nodePort: 30851}
