# Build the 3 images for both CPU architectures and publish them on Docker Hub.
#  - amd64 (Intel/AMD: cloud servers, GitHub runners) and arm64 (Apple Silicon Macs)
#  - each architecture is built natively on its own GitHub runner (no slow emulation)
#  - then both are merged under one tag: Docker picks the right one automatically
# Tags: <sha> (traceability: image = exact commit) and latest
name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository variable (Settings > Secrets and variables > Actions > Variables)
  REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: true
      matrix:
        image: [api, webapp, mlflow]
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_USER }}/ride-classifier-${{ matrix.image }}:${{ github.sha }}-${{ matrix.platform.arch }}
          # Layer cache kept by GitHub between runs: unchanged dependencies are not rebuilt
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}

  merge:
    name: Publish ${{ matrix.image }} (multi-arch)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, webapp, mlflow]
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Merge amd64 + arm64 under one tag
        run: |
          IMAGE=${REGISTRY_USER}/ride-classifier-${{ matrix.image }}
          docker buildx imagetools create \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"

  smoke-test:
    name: Smoke test (API image starts and answers)
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Run the published API image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e MLFLOW_TRACKING_URI=http://nowhere:5000 -e MLFLOW_HTTP_REQUEST_MAX_RETRIES=0 \
            ${REGISTRY_USER}/ride-classifier-api:${{ github.sha }}
          for i in $(seq 1 60); do curl -sf localhost:8000/docs > /dev/null && break; sleep 2; done
          curl -sf localhost:8000/docs > /dev/null || (docker logs api; exit 1)
          # No MLflow here: the API must start anyway and report "no model" (503), not crash
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health)" = "503"
          echo "API image OK"
