[project]
name = "ride-classifier"
version = "0.1.0"
description = "MLOps pipeline that classifies micromobility rides from IMU sensor data"
readme = "README.md"
authors = [
    { name = "raniamehria", email = "rania.mehria.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "matplotlib>=3.11.2",
    "mlflow==3.18.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ride-classifier = "ride_classifier:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
webapp = [
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

# PyTorch from PyPI ships CUDA on Linux (several GB). Docker images and CI run on Linux
# without GPU, so on Linux we take the CPU-only build. macOS keeps the normal package.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
